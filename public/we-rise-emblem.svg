<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" role="img" aria-labelledby="title description">
  <title id="title">We-Rise</title>
  <desc id="description">A circular We-Rise emblem with the words Rise Together, Rise Forever.</desc>
  <defs>
    <linearGradient id="outer-ring" x1="22" y1="18" x2="217" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd1e7"/>
      <stop offset="0.27" stop-color="#ff69b4"/>
      <stop offset="0.68" stop-color="#ff1493"/>
      <stop offset="1" stop-color="#a96fff"/>
    </linearGradient>
    <linearGradient id="letter-fill" x1="75" y1="65" x2="164" y2="157" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd5e9"/>
      <stop offset="1" stop-color="#ff69b4"/>
    </linearGradient>
    <radialGradient id="disc-fill" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#34264e"/>
      <stop offset="0.6" stop-color="#211b38"/>
      <stop offset="1" stop-color="#171529"/>
    </radialGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="motto-top" d="M 42 120 A 78 78 0 0 1 198 120"/>
    <path id="motto-bottom" d="M 42 120 A 78 78 0 0 0 198 120"/>
  </defs>

  <circle cx="120" cy="120" r="111" fill="#141224" opacity="0.72"/>
  <circle cx="120" cy="120" r="106" fill="url(#disc-fill)" stroke="url(#outer-ring)" stroke-width="6"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="#ffb6d9" stroke-opacity="0.42" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="76" fill="none" stroke="#ff69b4" stroke-opacity="0.15" stroke-width="1"/>

  <g fill="none" stroke="url(#outer-ring)" stroke-linecap="round" filter="url(#soft-glow)" opacity="0.72">
    <path d="M81 135 C67 113 69 91 87 72" stroke-width="2.4"/>
    <path d="M159 135 C173 113 171 91 153 72" stroke-width="2.4"/>
    <path d="M86 101 C77 96 73 88 74 80 C83 81 89 87 91 94" stroke-width="2"/>
    <path d="M154 101 C163 96 167 88 166 80 C157 81 151 87 149 94" stroke-width="2"/>
  </g>

  <path d="M120 46 L123.2 53.4 L131 56.5 L123.2 59.7 L120 67 L116.8 59.7 L109 56.5 L116.8 53.4 Z" fill="#ffb6d9" filter="url(#soft-glow)"/>
  <text x="118" y="139" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="89" font-weight="700" font-style="italic" fill="#fff1f8" letter-spacing="-4">W</text>
  <path d="M91 151 C106 156 134 156 149 151" fill="none" stroke="url(#outer-ring)" stroke-width="2" stroke-linecap="round"/>
  <text x="120" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2" fill="#ffffff">WE-RISE</text>

  <g font-family="Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2" fill="#ffc1df">
    <text>
      <textPath href="#motto-top" xlink:href="#motto-top" startOffset="50%" text-anchor="middle">RISE TOGETHER</textPath>
    </text>
    <text>
      <textPath href="#motto-bottom" xlink:href="#motto-bottom" startOffset="50%" text-anchor="middle">RISE FOREVER</textPath>
    </text>
  </g>
  <circle cx="40" cy="122" r="2.4" fill="#ff69b4"/>
  <circle cx="200" cy="122" r="2.4" fill="#ff69b4"/>
</svg>
