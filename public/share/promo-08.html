<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="⠀" />
  <meta name="robots" content="noindex,follow" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="af_ZA" />
  <meta property="og:title" content="⠀" />
  <meta property="og:description" content="⠀" />
  <meta property="og:image" content="https://werise-mu.vercel.app/share-images/we-rise-promo-08.jpeg" />
  <meta property="og:image:secure_url" content="https://werise-mu.vercel.app/share-images/we-rise-promo-08.jpeg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1061" />

  <meta property="og:image:alt" content="We-Rise promotional image" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="⠀" />
  <meta name="twitter:description" content="⠀" />
  <meta name="twitter:image" content="https://werise-mu.vercel.app/share-images/we-rise-promo-08.jpeg" />
  <meta name="theme-color" content="#0b0712" />
  <style>
    html,body{margin:0;min-height:100%;background:#000}
    body{display:grid;place-items:center}
    img{display:block;width:100%;height:auto;max-width:1080px}
  </style>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get('ref') || params.get('r') || '').toUpperCase();
      const code = raw.replace(/[^A-Z0-9]/g, '').slice(0, 40);
      const destination = code
        ? 'https://werise-mu.vercel.app/?ref=' + encodeURIComponent(code)
        : 'https://werise-mu.vercel.app/';
      window.addEventListener('DOMContentLoaded', () => {
        const link = document.getElementById('share-image-link');
        if (link) link.href = destination;
        window.setTimeout(() => window.location.replace(destination), 180);
      });
    })();
  </script>
</head>
<body>
  <a id="share-image-link" href="https://werise-mu.vercel.app/" aria-label="Open We-Rise">
    <img src="/share-images/we-rise-promo-08.jpeg" alt="We-Rise promotional image" />
  </a>
</body>
</html>
