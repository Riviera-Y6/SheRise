  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#151426;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}main{max-width:520px;text-align:center}img{width:min(100%,420px);max-height:70vh;object-fit:contain;border-radius:18px;box-shadow:0 18px 60px rgba(255,42,166,.22)}h1{font-size:1.55rem;margin:22px 0 8px}p{color:#c7c2d9;line-height:1.5}a{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:999px;background:linear-gradient(135deg,#ff2aa6,#9b4dff);color:white;text-decoration:none;font-weight:800}
  </style>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get('ref') || params.get('r') || '').toUpperCase();
      const code = raw.replace(/[^A-Z0-9]/g, '').slice(0, 40);
      const destination = code
        ? 'https://werise-mu.vercel.app/?ref=' + encodeURIComponent(code)
        : 'https://werise-mu.vercel.app/';
      window.addEventListener('DOMContentLoaded', () => {
        const link = document.getElementById('open-we-rise');
        if (link) link.href = destination;
        window.setTimeout(() => window.location.replace(destination), 120);
      });
    })();
  </script>
</head>
<body>
  <main>
    <img src="/share-images/we-rise-promo-07.jpeg" alt="We-Rise promotional image" />
    <h1>We-Rise — More Than an App</h1>
    <p>Join a supportive women-focused movement built around community, safety, wellness and opportunity.</p>
    <a id="open-we-rise" href="https://werise-mu.vercel.app/">Open We-Rise</a>
  </main>
</body>
