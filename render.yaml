services:
  - type: web
    name: we-rise-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENABLE_EMERGENCY_SMS
        value: "false"
      - key: API_PUBLIC_URL
        value: https://werise-api.onrender.com
      - key: ENABLE_PAYSTACK
        value: "false"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PLAN_CODE
        sync: false
      - key: PAYSTACK_CURRENCY
        value: ZAR
      - key: ENABLE_BACKMI_PAYMENTS
        value: "false"
      - key: ENABLE_GEMINI_AI
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TIMEOUT_MS
        value: "25000"
      - key: GEMINI_TRIAL_DAILY_LIMIT
        value: "10"
      - key: GEMINI_MEMBER_DAILY_LIMIT
        value: "30"
      - key: GEMINI_STAFF_DAILY_LIMIT
        value: "100"
      - key: WE_RISE_OWNER_EMAILS
        sync: false
      - key: WE_RISE_ADMIN_EMAILS
        sync: false
      - key: BACKMI_REVIEWER_EMAILS
        sync: false
      - key: SUPPORT_EMAIL_ENABLED
        value: "false"
      - key: SUPPORT_TO_EMAIL
        value: request4.support@gmail.com
      - key: SUPPORT_FROM_EMAIL
        value: request4.support@gmail.com
      - key: SUPPORT_FROM_NAME
        value: We-Rise Support
      - key: BREVO_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:request4.support@gmail.com
